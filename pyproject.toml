[project]
name = "wingmacro"
version = "0.1.0"
description = "Control a Behringer WING from a DOIO KB16 macro pad"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "hidapi>=0.14"]

[project.optional-dependencies]
dev = ["pytest"]
tray = ["pystray>=0.19", "pillow>=10"]  # menu-bar / tray icon (python -m wingmacro tray)
build = ["pyinstaller>=6"]

[project.scripts]
wingmacro = "wingmacro.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
wingmacro = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]
