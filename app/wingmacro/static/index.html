<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wingmacro</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="bw">WING</span><span class="bm">MACRO</span></div>
  <div id="selbar" class="selbar"><span class="selnum">—</span><span class="selname">No control selected</span></div>
  <div class="topstat">
    <span id="save-state" class="savestate"></span>
    <span class="chip"><i id="wing-dot" class="dot"></i><span id="wing-label">WING</span></span>
    <span class="chip"><i id="pad-dot" class="dot"></i>PAD</span>
    <span class="layerbox" title="Pad layer"><small>LAYER</small><span id="pad-layer">–</span></span>
  </div>
</header>
<nav id="nav">
  <button data-page="pad" class="on">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>PAD</button>
  <button data-page="macros">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/><path d="M18 14l3 3-3 3"/></svg>MACROS</button>
  <button data-page="console">
    <svg viewBox="0 0 24 24"><path d="M3 18h18M6 18V6M10 18v-8M14 18V9M18 18v-5"/><circle cx="6" cy="9" r="1.6"/><circle cx="10" cy="13" r="1.6"/><circle cx="14" cy="11" r="1.6"/><circle cx="18" cy="15" r="1.6"/></svg>CONSOLE</button>
  <button data-page="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>SETUP</button>
</nav>
<main id="page"></main>
<div id="modal" class="modal" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
